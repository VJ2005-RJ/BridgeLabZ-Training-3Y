<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Theme Switcher</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 30px; color: #222; }
        .container { max-width: 760px; margin: auto; }
        input, button { padding: 9px 12px; margin: 5px 3px 5px 0; }
        button { cursor: pointer; }
        .message { margin-top: 10px; }
        .error { color: #c62828; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Theme Switcher</h1>
        
        <p>Choose a theme for this page.</p>
        <button class="theme-button" data-theme="light">Light</button>
        <button class="theme-button" data-theme="dark">Dark</button>
        <button class="theme-button" data-theme="blue">Blue</button>
        <p id="currentTheme">Current theme: Light</p>

    </main>
    <script src="Q4_Theme_Switcher.js"></script>
</body>
</html>
