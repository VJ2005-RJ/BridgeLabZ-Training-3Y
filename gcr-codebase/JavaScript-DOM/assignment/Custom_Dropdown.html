<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Custom Dropdown Using JavaScript</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 30px; color: #222; }
        .container { max-width: 760px; margin: auto; }
        input, button { padding: 9px 12px; margin: 5px 3px 5px 0; }
        button { cursor: pointer; }
        .message { margin-top: 10px; }
        .error { color: #c62828; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Custom Dropdown Using JavaScript</h1>
        
        <div id="dropdown" style="position:relative; display:inline-block;">
            <button type="button" id="dropdownButton">Choose a subject ▼</button>
            <div id="dropdownOptions" class="hidden" style="position:absolute; top:100%; left:0; min-width:180px; background:white; border:1px solid #aaa; z-index:2;">
                <button type="button" class="dropdown-option" style="display:block; width:100%;" data-value="JavaScript">JavaScript</button>
                <button type="button" class="dropdown-option" style="display:block; width:100%;" data-value="HTML">HTML</button>
                <button type="button" class="dropdown-option" style="display:block; width:100%;" data-value="CSS">CSS</button>
                <button type="button" class="dropdown-option" style="display:block; width:100%;" data-value="Java">Java</button>
            </div>
        </div>
        <p id="selectedOption">No subject selected.</p>

    </main>
    <script src="Q8_Custom_Dropdown.js"></script>
</body>
</html>
