<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Image Gallery with Modal Preview</title>
    <style>
        * { box-sizing: border-box; }
        body { font-family: Arial, sans-serif; margin: 30px; color: #222; }
        .container { max-width: 760px; margin: auto; }
        input, button { padding: 9px 12px; margin: 5px 3px 5px 0; }
        button { cursor: pointer; }
        .message { margin-top: 10px; }
        .error { color: #c62828; font-size: 14px; }
        .hidden { display: none !important; }
    </style>
</head>
<body>
    <main class="container">
        <h1>Image Gallery with Modal Preview</h1>
        
        <p>Click any image to see a larger preview. Click outside the preview to close it.</p>
        <div id="gallery" style="display:grid; grid-template-columns:repeat(3, 1fr); gap:12px;">
            <img src="https://picsum.photos/id/1015/300/200" alt="Mountain landscape" class="gallery-image">
            <img src="https://picsum.photos/id/1025/300/200" alt="Dog" class="gallery-image">
            <img src="https://picsum.photos/id/1035/300/200" alt="Forest" class="gallery-image">
            <img src="https://picsum.photos/id/1043/300/200" alt="River" class="gallery-image">
            <img src="https://picsum.photos/id/1050/300/200" alt="Nature" class="gallery-image">
            <img src="https://picsum.photos/id/1067/300/200" alt="Sea" class="gallery-image">
        </div>
        <div id="imageModal" class="hidden" style="position:fixed; inset:0; background:rgba(0,0,0,.8); display:flex; align-items:center; justify-content:center; padding:20px;">
            <div id="modalContent" style="background:white; padding:12px; max-width:90%; max-height:90%;">
                <button id="closeModal" style="float:right;">Close</button>
                <img id="largeImage" src="" alt="Selected image preview" style="display:block; max-width:80vw; max-height:75vh;">
            </div>
        </div>
        <style>
            .gallery-image { width:100%; height:130px; object-fit:cover; cursor:pointer; }
        </style>

    </main>
    <script src="Q5_Image_Gallery.js"></script>
</body>
</html>
