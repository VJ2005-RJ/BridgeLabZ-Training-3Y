<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Event Subscriptions</title>
    <style>
        body { font-family: Arial; margin: 25px; }
        li { margin: 8px; }
        button { margin-left: 8px; }
        #message { color: green; }
    </style>
</head>
<body>
    <header><h1>Event Subscription Panel</h1></header>
    <main>
        <button id="subscribe">Subscribe</button>
        <button id="unsubscribe">Unsubscribe</button>
        <p id="status">Notifications are off.</p>
        <h2>Topics</h2>
        <ul id="topics">
            <li>Workshops <button class="remove">Remove</button></li>
            <li>Seminars <button class="remove">Remove</button></li>
            <li>Sports <button class="remove">Remove</button></li>
        </ul>
        <input type="text" id="newTopic" placeholder="New topic">
        <button id="addTopic">Add Topic</button>
        <p id="message"></p>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
