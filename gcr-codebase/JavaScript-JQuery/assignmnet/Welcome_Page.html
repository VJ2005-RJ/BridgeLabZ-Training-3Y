<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome Page</title>
    <style>
        body { font-family: Arial; margin: 30px; }
        .box { padding: 15px; background: #eef4ff; margin: 10px 0; }
        button { margin: 5px; padding: 8px 12px; }
    </style>
</head>
<body>
    <header><h1>Welcome to Our Website</h1></header>
    <main>
        <h2 id="greeting">Hello!</h2>
        <button id="changeGreeting">Change Greeting</button>
        <button id="toggleWelcome">Show / Hide Welcome Message</button>
        <p id="welcomeMessage" class="box">We are happy to have you here. Have a great day!</p>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
