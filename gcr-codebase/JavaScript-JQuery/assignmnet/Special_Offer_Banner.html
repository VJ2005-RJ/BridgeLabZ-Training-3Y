<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Special Offers</title>
    <style>
        body { font-family: Arial; margin: 25px; }
        .banner { padding: 25px; margin: 10px 0; background: #e7f3ff; border: 1px solid #8ab; }
        button { margin: 4px; padding: 7px 10px; }
    </style>
</head>
<body>
    <header><h1>Special Offers</h1></header>
    <main>
        <div class="banner">Offer 1: 20% off on books</div>
        <div class="banner">Offer 2: Buy one get one free</div>
        <div class="banner">Offer 3: Free delivery today</div>
        <button id="hide">Hide First</button>
        <button id="show">Show All</button>
        <button id="slideUp">Slide Up</button>
        <button id="slideDown">Slide Down</button>
        <button id="fadeOut">Fade Out</button>
        <button id="fadeIn">Fade In</button>
    </main>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="script.js"></script>
</body>
</html>
