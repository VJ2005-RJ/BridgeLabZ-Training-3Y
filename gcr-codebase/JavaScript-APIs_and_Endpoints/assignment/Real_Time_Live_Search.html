<!DOCTYPE html>
<html>
<head>
  <title>Live Product Search</title>
  <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
  <style>
    body { font-family: Arial; margin: 30px; }
    input { padding: 10px; width: 280px; }
    .product { border: 1px solid #ccc; padding: 10px; margin: 8px 0; width: 330px; }
    img { vertical-align: middle; margin-right: 12px; }
  </style>
</head>
<body>
  <h2>Product Live Search</h2>
  <input type="text" id="search" placeholder="Search products...">
  <p id="loading" style="display:none;">Loading...</p>
  <div id="results"></div>

  <script>
    $("#search").on("input", function () {
      let value = $(this).val().trim();
      $("#loading").show();
      $("#results").html("");

      $.ajax({
        url: "http://localhost:3001/products",
        method: "GET",
        data: { q: value },
        success: function (products) {
          $("#loading").hide();
          if (products.length === 0) {
            $("#results").html("<p>No products found</p>");
            return;
          }
          products.forEach(function (product) {
            $("#results").append(
              `<div class="product">
                <img src="${product.image}" width="100" alt="Product">
                <b>${product.name}</b><br>Price: ₹${product.price}
              </div>`
            );
          });
        },
        error: function () {
          $("#loading").hide();
          $("#results").html("<p>Unable to load products.</p>");
        }
      });
    });
  </script>
</body>
</html>
