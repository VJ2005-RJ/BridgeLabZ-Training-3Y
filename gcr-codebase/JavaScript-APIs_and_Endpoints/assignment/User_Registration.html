<!DOCTYPE html>
<html>
<head>
  <title>User Registration</title>
  <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
  <style>
    body { font-family: Arial; margin: 30px; }
    input, button { padding: 9px; margin: 5px; }
  </style>
</head>
<body>
  <h2>User Registration</h2>
  <form id="form">
    <input type="text" id="name" placeholder="Enter name" required><br>
    <input type="email" id="email" placeholder="Enter email" required><br>
    <button type="submit">Register</button>
  </form>
  <p id="message"></p>

  <script>
    document.getElementById("form").addEventListener("submit", async function (event) {
      event.preventDefault();

      let name = document.getElementById("name").value.trim();
      let email = document.getElementById("email").value.trim();
      let message = document.getElementById("message");

      try {
        let check = await axios.get("http://localhost:3006/users", {
          params: { email: email }
        });

        if (check.data.length > 0) {
          message.innerText = "Email already registered.";
          return;
        }

        await axios.post("http://localhost:3006/users", {
          name: name,
          email: email
        });

        message.innerText = "Registration successful.";
        document.getElementById("form").reset();
      } catch (error) {
        message.innerText = "Registration failed. Please try again.";
      }
    });
  </script>
</body>
</html>
